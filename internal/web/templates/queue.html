<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chassis — Queue</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="queue">
{{template "nav" .}}
<main class="chassis-main">
  <div class="chassis-toolbar">
    <input type="search" id="search" placeholder="Search subject, requester, item code... (/)" autocomplete="off">
    <select id="filter-status">
      <option value="">All statuses</option>
      <option value="NEW">New</option>
      <option value="OPEN">Open</option>
      <option value="PENDING_USER">Pending user</option>
      <option value="RESOLVED">Resolved</option>
      <option value="CLOSED">Closed</option>
    </select>
    <span class="chassis-hint">j/k move · enter open · / search</span>
  </div>

  <table class="chassis-queue" id="queue-table">
    <thead>
      <tr>
        <th>Code</th>
        <th>Priority</th>
        <th>Subject</th>
        <th>Requester</th>
        <th>Assigned</th>
        <th>Status</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody id="queue-body">
      <tr><td colspan="7" class="chassis-empty">Loading queue…</td></tr>
    </tbody>
  </table>
</main>
<script src="/static/app.js"></script>
</body>
</html>
