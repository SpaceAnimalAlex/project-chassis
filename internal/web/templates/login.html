<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chassis — Sign in</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="login">
  <main class="chassis-login">
    <form id="login-form" class="chassis-login__card">
      <h1>Chassis</h1>
      <p id="login-error" class="chassis-login__error" hidden></p>
      <label>
        Email
        <input type="email" id="login-email" autocomplete="username" required>
      </label>
      <label>
        Password
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign in</button>
      <p class="chassis-hint">This device stays signed in independently of any others you're already using.</p>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
